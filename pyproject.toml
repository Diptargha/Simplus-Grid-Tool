[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplusgt"
version = "0.1.0"
description = "Python migration of the non-Simulink Simplus Grid Tool pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "networkx>=3.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
simplusgt = "simplusgt.cli:main"

[tool.setuptools.packages.find]
include = ["simplusgt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
